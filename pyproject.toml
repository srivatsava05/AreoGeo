[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "API for processing KML and zipped Shapefile measurements"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1,<2",
  "geopandas>=0.14,<2",
  "pyproj>=3.6,<4",
  "shapely>=2,<3",
  "sqlalchemy>=2,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
